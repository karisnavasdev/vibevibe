<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Discover · vibe/vibe</title>
  <meta name="theme-color" content="#101214"/>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body data-page="discover">
  <div id="top"></div>
  <main class="page" id="main">
    <div class="pair-row" id="pairs" role="group" aria-label="Pairs"></div>
    <div class="disc-head">
      <h1>Discover</h1>
      <div class="tabs" role="tablist">
        <button class="tab" type="button" data-tab="trending" aria-pressed="true">Trending</button>
        <button class="tab" type="button" data-tab="final" aria-pressed="false">Final stretch</button>
        <button class="tab" type="button" data-tab="new" aria-pressed="false">New</button>
        <button class="tab" type="button" data-tab="graduated" aria-pressed="false">Graduated</button>
        <button class="tab" type="button" data-tab="movers" aria-pressed="false">Top movers</button>
      </div>
      <button class="filters" id="filters" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        Filters
      </button>
    </div>
    <div class="filter-panel" id="filter-panel">
      <label>MIN CURVE
        <select id="min-progress">
          <option value="0">Any progress</option>
          <option value="40">40%+</option>
          <option value="70">70%+</option>
          <option value="90">90%+</option>
        </select>
      </label>
      <button class="ghost" type="button" onclick="document.getElementById('min-progress').value='0';document.getElementById('min-progress').dispatchEvent(new Event('change'))">Clear</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more-wrap"><button class="more" id="more" type="button">Load more</button></div>
    <p class="status-line" id="status"></p>
  </main>
  <div id="tab"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
